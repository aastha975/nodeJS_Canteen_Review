<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — CampusBite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="main-content">
        <div class="auth-wrapper" style="max-width: 480px;">
            <div class="auth-header">
                <div class="brand-icon"><i data-lucide="utensils-crossed"></i></div>
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-sub">Join CampusBite to rate canteens & compare dishes</p>
            </div>

            <div id="alertBox"></div>

            <div class="card">
                <div class="card-body">
                    <form id="registerForm">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" placeholder="e.g. John Doe" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">College Email</label>
                            <input type="email" id="email" class="form-control" placeholder="name@college.edu" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password (min 8 chars)</label>
                            <input type="password" id="password" class="form-control" minlength="8" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">Role</label>
                                <select id="role" class="form-control" required>
                                    <option value="student">Student</option>
                                    <option value="faculty">Faculty</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Department</label>
                                <input type="text" id="department" class="form-control" placeholder="e.g. CS">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-full mt-2">
                            <i data-lucide="user-plus"></i> Register
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <span>Already have an account?</span>
                    <a href="index.html" style="font-weight: 700; margin-left: 0.35rem;">Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/navbar.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const department = document.getElementById('department').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role, department })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('alertBox').innerHTML = `
                    <div class="alert alert-success">
                        <i data-lucide="check-circle"></i>
                        <div>Account created! You can now <a href="index.html">Sign In</a>.</div>
                    </div>
                `;
            } else {
                document.getElementById('alertBox').innerHTML = `
                    <div class="alert alert-error">
                        <i data-lucide="alert-circle"></i>
                        <div>${data.error}</div>
                    </div>
                `;
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
