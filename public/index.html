<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CampusBite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-header">
                <div class="brand-icon">
                    <i data-lucide="utensils-crossed"></i>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-sub">Sign in to your CampusBite Portal</p>
            </div>

            <div id="alertBox"></div>

            <div class="card">
                <div class="card-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label">College Email</label>
                            <input type="email" id="email" class="form-control" placeholder="name@college.edu" required autofocus>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-full mt-2">
                            <i data-lucide="log-in"></i> Sign In
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <span>Don't have an account?</span>
                    <a href="register.html" style="font-weight: 700; margin-left: 0.35rem;">Register here</a>
                </div>
            </div>

            <div class="demo-credentials-box">
                <strong><i data-lucide="key"></i> Demo Accounts (Password: <code>password123</code>):</strong>
                <div class="demo-chips">
                    <button type="button" class="demo-chip" onclick="quickFill('aastha@college.edu')">Student (Aastha)</button>
                    <button type="button" class="demo-chip" onclick="quickFill('faculty.cs@college.edu')">Faculty (CS)</button>
                    <button type="button" class="demo-chip" onclick="quickFill('admin.bappa@college.edu')">Admin (Bappa)</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/navbar.js"></script>
    <script>
        function quickFill(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'password123';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (res.ok) {
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('alertBox').innerHTML = `
                    <div class="alert alert-error">
                        <i data-lucide="alert-circle"></i>
                        <div>${data.error}</div>
                    </div>
                `;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
